name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # tags, for git describe in scripts/build.py

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Vet and test
      run: |
        go vet ./...
        go test ./...

    - name: Build release binaries
      run: python3 scripts/build.py amd64 arm64

    - name: Package
      run: |
        mkdir -p release
        for arch in amd64 arm64; do
          cp "dist/linux/$arch/tea" "release/tea-linux-$arch"
        done
        (cd release && sha256sum tea-linux-* > SHA256SUMS)

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # actions/checkout turns the annotated tag into a lightweight one (actions/checkout#290);
        # fetch the real tag object again so that --notes-from-tag sees the annotation
        git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
        test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag || { echo "$GITHUB_REF_NAME is not an annotated tag"; exit 1; }
        gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-from-tag
