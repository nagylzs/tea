name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build Linux Amd64
      env:
        GOOS: linux
        GOARCH: amd64
      run: |
        go build -o tea cmd/tea/tea.go

    - name: 'Upload Linux Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: tea-linux-amd64
        path: tea
        retention-days: 5

