name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]   # the tests need stdbuf: macOS has it from 15 on
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # tags, for git describe in scripts/build.py

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Vet and test
      run: |
        go vet ./...
        go test ./...

    # the binaries for every target are cross-compiled once, on Linux
    - name: Build release binaries
      if: runner.os == 'Linux'
      run: python3 scripts/build.py linux/amd64 linux/arm64 darwin/amd64 darwin/arm64

    - name: Upload Linux amd64 artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: tea-linux-amd64
        path: dist/linux/amd64/tea
        retention-days: 5

    - name: Upload Linux arm64 artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: tea-linux-arm64
        path: dist/linux/arm64/tea
        retention-days: 5

    - name: Upload macOS amd64 artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: tea-darwin-amd64
        path: dist/darwin/amd64/tea
        retention-days: 5

    - name: Upload macOS arm64 artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: tea-darwin-arm64
        path: dist/darwin/arm64/tea
        retention-days: 5
