name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # tags, for git describe in scripts/build.py

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Vet and test
      run: |
        go vet ./...
        go test ./...

    - name: Build release binaries
      run: python3 scripts/build.py amd64 arm64

    - name: Upload Linux amd64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: tea-linux-amd64
        path: dist/linux/amd64/tea
        retention-days: 5

    - name: Upload Linux arm64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: tea-linux-arm64
        path: dist/linux/arm64/tea
        retention-days: 5
